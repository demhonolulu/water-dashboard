tbody tr:nth-child(even) { background: #0d1020; }

.chart-footer {

  <script>
window.__DATA__ = window.__DATA__ || {};
const __real_fetch__ = window.fetch.bind(window);
window.fetch = function(url, options) {
  const knownKeys = [
    'json/locations.json',
    'json/veoci-export.json',
    'json/area.json',
    'json/config.json',
    'json/historic-data.json'
  ];
  const key = knownKeys.find(k => url === k || url.endsWith('/' + k) || url === k.split('/').pop());
  if (key) {
    return new Promise((resolve) => {
      const interval = setInterval(() => {
        if (window.__DATA__ && window.__DATA__[key] !== undefined) {
          clearInterval(interval);
          resolve({
            ok: true,
            json: () => Promise.resolve(window.__DATA__[key])
          });
        }
      }, 20);
    });
  }
  return __real_fetch__(url, options);
};
</script>
  <script>

// Water Gauge Dashboard

const params    = new URLSearchParams(window.location.search);
const preset    = params.get('preset');

// stream and dam location data
let LOCATIONS = {};
let LOCATION_IDS;
let VEOCI_NOTES = {};
let AREAS = [];
let HISTORIC = [];

// dont look
let API_KEY = 'bqirQ15zF4kGK34QsRqlSlN0PhSUCEFB9My7cwJ1';

let graphCount = 0;
let charts = [];

let USGS_OVERVIEW = [];

const BASE_URL = 'https://api.waterdata.usgs.gov/ogcapi/v0/collections/';
const CONFIG_SETTINGS = 
    '?f=json' +
    '&lang=en-US' +
    '&limit=50000' +
    '&skipGeometry=true' +

let ALL_ITEMS_URL = BASE_URL;

let countdownInterval;

// configs
let CONFIG_VALUES;

const overlay = document.getElementById('loading-overlay');
function showLoading() { overlay.classList.add('active');    }
function hideLoading() { overlay.classList.remove('active'); }

const thresholdLinesPlugin = {
    id: 'thresholdLines',
    afterDraw(chart, args, options) {
        const { ctx, chartArea, scales } = chart;
        const yScale = scales.y;

        if (!options || !options.lines) return;

        options.lines.forEach(line => {
            const { value, color = 'yellow', dash = [] } = line;

            if (value < yScale.min || value > yScale.max) return;

            const y = yScale.getPixelForValue(value);

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(chartArea.left, y);
            ctx.lineTo(chartArea.right, y);
            ctx.lineWidth = 2;
            ctx.strokeStyle = color;
            ctx.setLineDash(dash);
            ctx.stroke();
            ctx.restore();
        });
    }
};
Chart.register(thresholdLinesPlugin);


// all items
// https://api.waterdata.usgs.gov/ogcapi/v0/collections/latest-continuous/items?f=json&lang=en-US&limit=50000&skipGeometry=false&offset=0&monitoring_location_id=USGS-16210000
// individual
// https://api.waterdata.usgs.gov/ogcapi/v0/collections/continuous/items?limit=50000&properties=time,value,unit_of_measure,approval_status,qualifier&time_series_id=26e3b29b90d34a3baf13ebe7c297197a&time=P7D


// ── DOM refs ──────────────────────────────────────────────
const gaugesTableDiv = document.getElementById('allGaugesTable');
const graphs         = document.getElementById('allGraphs');
const sectionTable   = document.getElementById('sectionTable');
const sectionButtons = document.getElementById('sectionButtons');
const sectionGraphs  = document.getElementById('sectionGraphs');

// ── Init ──────────────────────────────────────────────────
async function init() {
    showLoading();
    try {
        // fetch json files
        const [locationsResult, veociResult, areaResult, configResult, historicResult] = await Promise.all([
            fetchAndWait('locations.json'),
            fetchAndWait('veoci-export.json'),
            fetchAndWait('area.json'),
            fetchAndWait('config.json'),
            fetchAndWait('historic-data.json')
        ]);
        CONFIG_VALUES = configResult;
        loadPreset()

        loadParams();

        LOCATIONS = locationsResult;
        LOCATION_IDS = Object.keys(LOCATIONS).join(',');
        VEOCI_NOTES = veociResult.Sheet0;
        AREAS = areaResult.sort((a, b) => a.Order - b.Order);
        HISTORIC = getCurrentMonthHistoric(historicResult);

        buildURLLinks();

        // fetch usgs data for gauge dashboard overview
        const [overviewResults] = await Promise.all([
            fetchAndWait(USGS_OVERVIEW_URL)
        ]);

        USGS_OVERVIEW = overviewResults.features;

        //console.log(VEOCI_NOTES);
        //console.log(LOCATIONS);
        //console.log(USGS_OVERVIEW);

        buildNewGaugeTable();

        const [presetLoad] = await Promise.all([
            loadGaugeGraphs()
        ]);
        
        startCountdown(CONFIG_VALUES["reload-time"]);
        hideLoading();
    } 
    catch (err) {
        console.error(err);
    }
}

init();

// ── SETUP ─────────────────────────────────────────────────
function loadParams() {
    const paramMappings = {
        'title': 'title',
        'display-mode': 'display-mode',
        'reload-time': 'reload-time',
        'table-columns': ['gauge-table', 'columns'],
        'graph-columns': ['gauge-graphs', 'columns'],
        'graph-sites': ['gauge-graphs', 'sites']
    };
    
    for (const [paramKey, pathArray] of Object.entries(paramMappings)) {
        const value = params.get(paramKey);
        if (value !== null) {
            if (Array.isArray(pathArray)) {
                let target = CONFIG_VALUES;
                for (let i = 0; i < pathArray.length - 1; i++) {
                    target = target[pathArray[i]] = target[pathArray[i]] || {};
                }
                target[pathArray[pathArray.length - 1]] = value;
            } else {
                CONFIG_VALUES[pathArray] = value;
            }
        }
    }
}

function loadPreset() {
    if (preset == null || isNaN(preset))
        return;

    const previewValues = CONFIG_VALUES.presets[`${preset}`];
    if (previewValues == null)
        return;

    CONFIG_VALUES = { ...CONFIG_VALUES, ...previewValues };

    updateDisplayMode(CONFIG_VALUES["display-mode"]);
}

function buildURLLinks() {   
    INDIVIDUAL_URL = INDIVIDUAL_URL +
        'continuous/items' + CONFIG_SETTINGS +
        '&api_key=' + API_KEY +
        '&properties=time,value,unit_of_measure' + 
        '&time=P7D' + 
        '&time_series_id=';

    USGS_OVERVIEW_URL = USGS_OVERVIEW_URL + 
        'continuous/items' + CONFIG_SETTINGS +
        '&api_key=' + API_KEY +
        '&monitoring_location_id=' + LOCATION_IDS +
        '&unit_of_measure=ft' + 
        '&time=PT2H' +
        '&properties=monitoring_location_id,time_series_id,value,unit_of_measure,time';
}

function getCurrentMonthHistoric(json) {
    const now = new Date();
    const currentMonth = String(now.getMonth() + 1).padStart(2, '0');

    const filtered = {};
    for (const [locationId, data] of Object.entries(json)) {
        const match = data.monthly.find(m => m.month.split('-')[1] === currentMonth);
        filtered[locationId] = {
            currentMonth: match || null,
            yearly: data.yearly_summaries[0] || null
        };
    }
    return filtered;
}

function buildNewGaugeTable() {
    //const areaGrouping = groupSitesByArea();
    const usgsGrouping = groupUSGSBySite(); // map

    let row, cellCount;

    AREAS.forEach((area) => {
        // create last column stacked tables
        const div = document.createElement('div');
        const table = document.createElement('table');
        table.classList.add('gauge-table', `${area.Area.replace(/ /g, '-')}`);
        table.style.border = `2px solid ${area.Color}`;
        
        // table header
        const thead = document.createElement('thead');
        const thr = document.createElement('tr');
        const thh = document.createElement('th');

        thh.textContent = area.Area;
        thh.colSpan = area.Sites.length;
        thh.style.color = area.Color;

        thr.appendChild(thh);
        thead.appendChild(thr);
        table.appendChild(thead);

        // column rows
        row = null;
        cellCount = 0;

        const tbody = document.createElement('tbody');
        area.Sites.forEach((site) => {
            // site = number without prefix usgs
            const usgsId = 'USGS-' + site;
            const usgsItem = usgsGrouping.get(usgsId);
            const locationItem = LOCATIONS[usgsId];

            /*
            console.log(site);
            console.log(usgsItem);
            console.log(locationItem);*/

            if (cellCount % CONFIG_VALUES["gauge-tables"].columns === 0) {
                row = tbody.insertRow();
                row.classList.add('gauge-row');
                cellCount = 0;
            }
            
            const cell = row.insertCell();
            cell.style.height = '50px';
            
            cell.innerHTML = `${gaugeReport(usgsItem, locationItem)}`;
            cell.classList.add('gauge-cell', `${usgsId}`);
            const thresholdLevel = getCurrentThreshold(usgsItem, locationItem);
            if (thresholdLevel !== null) {
                cell.classList.add(`threshold-highlighted-${thresholdLevel}`);
            }

            cell.style.cursor = 'pointer';
            cell.addEventListener('click', (event) => handleCellClick(usgsItem.items, event));

            cellCount++;
        });

        // create last stacked table in single row
        table.appendChild(tbody);
        switch(area.Area) {
            case 'NORTH SHORE':
            case 'KOOLAUPOKO':
            case 'PRIMARY URBAN CENTER':
            case 'CENTRAL OAHU':
                div.style.height = '100%';
                div.appendChild(table);
                gaugesTableDiv.appendChild(div);
                break;
            case 'KOOLAULOA':
                div.id = 'div-stacked-tables';
                div.style.display = 'flex';
                div.style.flexDirection = 'column';
                div.style.gap = '5px';
                div.appendChild(table);
                gaugesTableDiv.appendChild(div);
                break;
            case 'WAIANAE':
            case 'EWA':
                const stackedDiv = document.getElementById('div-stacked-tables');
                stackedDiv.appendChild(table);
                gaugesTableDiv.appendChild(stackedDiv);
        }
    });
}

function groupSitesByArea() {
    return Object.values(
        VEOCI_NOTES.reduce((acc, item) => {
            const area = item.Area;
            if (!acc[area]) {
                acc[area] = { Area: area, Sites: [] };
            }
            acc[area].Sites.push(item.SiteID);
            return acc;
        }, {})
    );
}

function groupUSGSBySite() {
    const map = new Map();
    
    USGS_OVERVIEW.forEach((item) => {
        const locationId = item.properties?.monitoring_location_id;
        if (!locationId) return;
        
        if (!map.has(locationId)) {
            map.set(locationId, {
                monitoring_location_id: locationId,
                items: []
            });
        }
        map.get(locationId).items.push(item);
    });
    
    for (const [locationId, group] of map) {
        group.items.sort((a, b) => {
            const timeA = new Date(a.properties?.time);
            const timeB = new Date(b.properties?.time);
            return timeA - timeB;
        });
    }
    
    return map;
}

function gaugeReport(usgsItem, locationItem) {
    const currentDisplayThreshold = getCurrentThreshold(usgsItem, locationItem);
    const textColor = getWarningColor(currentDisplayThreshold);

    let report = `
        <div class="gauge-cell-location" style="color: ${textColor}">
            ${removeLocationSuffix(locationItem.properties.monitoring_location_name)}
        </div>        
    `;

    if (hasUSGSReports(usgsItem)) {
        const oldMeasure = usgsItem.items[0].properties;
        const newMeasure = usgsItem.items[usgsItem.items.length - 1].properties;

        const gaugeDiff = calcGaugeDiff(oldMeasure.value, newMeasure.value);
        const diff = `<span class="gauge-cell-diff" style="color: ${gaugeDiff.color}"> (${gaugeDiff.change} ${gaugeDiff.percent} ${gaugeDiff.symbol})</span>`

        const dateItem = `${new Date(newMeasure.time).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }).replace(' ', '')}`;
        const thresholdItem = getThresholdDisplay(usgsItem, locationItem.properties.thresholds);
        report += `
            <div class="gauge-cell-value">
                <span style="color: #CCCCCC">${newMeasure.value}ft </span>${diff}
            </div>

            <div class="gauge-cell-date">
                <small><span>${dateItem}</span>${thresholdItem}</small>
            </div>
        `;
    }

    return report;
}

function hasUSGSReports(usgsItem) {
    return (usgsItem && usgsItem.items && usgsItem.items.length > 0);
}

function removeLocationSuffix(str) {
    const parts = str.split(',');

    if (parts.length > 2) {
        return parts.slice(0, -2).join(',').trim();
    }

    return str;
}

function calcGaugeDiff(oldMeasure, newMeasure) {
    const greater = newMeasure > oldMeasure;
    const less = newMeasure < oldMeasure;

    const changeAmount = oldMeasure !== 0
        ? (newMeasure - oldMeasure) / oldMeasure
        : 0;

    let colorVal, symbolVal;

    if (greater) {
        const intensity = Math.min(changeAmount / 100, 1); // 0 to 1, capped at 100%

        const r = Math.round(217 - (217 * intensity)); // 217 → 0
        const g = Math.round(234 - (234 - 255) * intensity); // 234 → 255
        const b = Math.round(211 - (211 * intensity)); // 211 → 0

        colorVal = `rgb(${r}, ${g}, ${b})`;
        symbolVal = '▲';
    }
    else if(less) {
        colorVal = '#FFB3B3';
        symbolVal = '▼';
    }
    else {
        colorVal = '#FFFFFF';
        symbolVal = '=';
    }

    return {
        color: colorVal,
        change: `${greater ? '+' : ''}${changeAmount.toFixed(2)} `,
        percent: `${(changeAmount * 100).toFixed(2)}% `,
        symbol: symbolVal
    }
}

function getWarningColor(threshold) {
    switch (threshold) {
        case 'action':
            return "#8B0000";
        case 'major':
            return "#EE4B2B";
        case 'minor':
            return "#FFEA00";
        default:
            return "#FFFFFF";
    }
}

function getCurrentThreshold(usgsItem, locationItem) {
    if (!hasUSGSReports(usgsItem)) {
        console.log("No USGS values items: " + locationItem.properties.monitoring_location_number);
        return null;
    }

    const value = usgsItem.items[usgsItem.items.length - 1].properties.value;
    const thresholdsObject = locationItem.properties.thresholds;
    const { base, minor, major, action } = thresholdsObject;

    //console.log(`${value} - ${base} - ${minor} - ${major} - ${action}`);
    const isNear = (threshold) => {
        if (threshold == null) return false;
        return value >= (threshold - ((threshold - base) * 0.1));
    };

    if (isNear(action)) return 'action';
    if (isNear(major)) return 'major';
    if (isNear(minor)) return 'minor';

    return null;
}

function getThresholdDisplay(usgsItem, thresholdObj) {
    if (!hasUSGSReports(usgsItem))
        return "";

    const value = usgsItem.items[usgsItem.items.length - 1].properties.value;
    const { base, minor, major, action } = thresholdObj;

    let threshold = null;
    if (minor != null && value < minor) threshold = 'minor';
    else if (major != null && value < major) threshold = 'major';
    else if (action != null && value < action) threshold = 'action';

    if(threshold == null)
        return "";

    return `
        <span style="color: ${getWarningColor(threshold)}">
            ${thresholdObj[threshold]}ft
        </span>
    `;
}

// ── Button click ──────────────────────────────────────────
function changeDisplayMode() {
    let mode;
    switch(CONFIG_VALUES["display-mode"]) {
        case 1:
            mode = 2;
            break;
        case 2:
            mode = 3;
            break;
        case 3:
            mode = 1;
            break;
    }

    updateDisplayMode(mode);
}

function updateDisplayMode(mode) {
    const displayButton = document.getElementById('displayButton');
    CONFIG_VALUES["display-mode"] = parseInt(mode);
    displayButton.textContent = CONFIG_VALUES["display-mode"];

    switch(CONFIG_VALUES["display-mode"]) {
        case 1:
            sectionTable.classList.remove('hidden');
            sectionButtons.classList.remove('hidden');
            sectionGraphs.classList.remove('hidden');
            break;
        case 2:
            sectionTable.classList.remove('hidden');
            sectionButtons.classList.add('hidden');
            sectionGraphs.classList.add('hidden');
            break;
        case 3:
            sectionTable.classList.add('hidden');
            sectionButtons.classList.add('hidden');
            sectionGraphs.classList.remove('hidden');
            break;
    }
}

async function fetchAndWait(url) {
    const response = await fetch(url);

    if (!response.ok) {
        throw new Error(`ERROR status: ${response.status}`);
    }
    const data = await response.json();
    return data;
}

// click table cell
async function handleCellClick(item, event) {
    item = Array.from(item).pop();
    if (item == null) {
        
        return;
    }

    const td = event.target.closest('td');
    const location_id = item.properties.monitoring_location_id;
    const time_series_id = item.properties.time_series_id;

    // unselect if selected
    if (td.classList.contains('selected')) {
        td.classList.remove('selected');
        graphCount--;

        const charId = 'chart-' + location_id;

        // destory chart
        const chartIndex = charts.findIndex(chart => chart.id === charId);
        if (chartIndex !== -1) {
            const chartItem = charts[chartIndex];

            // get the cell from the canvas
            const cell = chartItem.instance.canvas.closest('td');
            const row = cell.closest('tr');
            if (cell) {
                cell.remove();
            }

            // remove row if empty
            if (row && row.cells.length === 0) {
                row.remove();
            }

            chartItem.instance.destroy();

            // remove from array
            charts.splice(chartIndex, 1);
        }
        return;
    }

    let data = await GetGraphData(time_series_id);
    await buildGraph(location_id, time_series_id, data);
    const chart = charts.find(chart => chart.id === `chart-${location_id}`);
    setRangeIndividual(chart, CONFIG_VALUES["gauge-graphs"]["default-scale"]);
    console.log(chart);
    //setRangeIndividual
}

async function GetGraphData(time_series_id) {
    console.log("FETCH: Graph data");
    const response = await fetch(INDIVIDUAL_URL + time_series_id, {
        method: 'GET'
    });

    if (!response.ok) {
        throw new Error(`ERROR status: ${response.status}`);
    }
    const data = await response.json();
    return data;
}

// graphs
async function loadGaugeGraphs() {
    if (CONFIG_VALUES["gauge-graphs"].sites == null && CONFIG_VALUES["gauge-graphs"].sites.length < 1) {
        return;
    }
    
    const sites = CONFIG_VALUES["gauge-graphs"].sites;
    const timeSeriesData = [...new Map(
        USGS_OVERVIEW.map(item => [
            item.properties?.monitoring_location_id,
            item.properties?.time_series_id
        ]).filter(([location, timeSeries]) => location && timeSeries)
    )].map(([monitoring_location_id, time_series_id]) => ({
        monitoring_location_id,
        time_series_id
    }));

    const siteTimeSeries = [];
    sites.forEach((site) => {
        const match = timeSeriesData.find(data => data.monitoring_location_id === site);
        if (match) {
            siteTimeSeries.push({
                site: site,
                time_series_id: match.time_series_id
            });
        }
    });
  
    const fetchPromises = siteTimeSeries.map(async (item) => ({
        key: item.site,
        data: await GetGraphData(item.time_series_id)
    }));

    const results = await Promise.all(fetchPromises);
    const dynamicStore = {};
    results.forEach(({ key, data }) => {
        dynamicStore[key] = data;
    });

    await Promise.all(results.map((item) => {
        const match = timeSeriesData.find(data => data.monitoring_location_id === item.key).time_series_id;
        return buildGraph(item.key, match, item.data);
    }));

    await new Promise(r => setTimeout(r, 1000));

    setRange(CONFIG_VALUES["gauge-graphs"]["default-scale"]);
}

async function buildGraph(location_id, time_series_id, data) {
    let info = LOCATIONS[location_id];

    let row;
    if (graphCount <= 0 || (graphCount % (CONFIG_VALUES["gauge-graphs"].columns)) == 0) {
        row = graphs.insertRow();
    }
    else {
        row = graphs.rows[graphs.rows.length - 1];
    }
        
    const cell = row.insertCell();

    const chartId = `chart-${info.id}`;
    cell.innerHTML = `
        <div class="chart-container">
            <canvas id="${chartId}"></canvas>
        </div>
        <div class="chart-footer ${location_id}"></div>
    `;

    // format data to chartjs format
    let formattedData = formatData(data);

    const yValues = formattedData.map(d => d.y);
    const min = Math.min(...yValues);
    const max = Math.max(...yValues);
    const padding = (max - min) * 0.1;

    let chartColor = 'rgb(0, 170, 204)';
    let thresholdArray = createThresholdArray(info.properties.thresholds);

    const ctx = document.getElementById(chartId).getContext('2d');
    const newChart = new Chart(ctx, {
        type: 'line',
        data: {
            datasets: [{
                data: formattedData,
                borderColor: chartColor,
                backgroundColor: chartColor + '20',
                borderWidth: 2,
                fill: true,
                tension: 0.2,
                pointRadius: 0,
                pointHoverRadius: 4,
                pointBorderWidth: 0,
                //spanGaps: false
            }]
        },
        options: {
            responsive: true,
            //maintainAspectRatio: true,
            interaction: {
                mode: 'nearest',
                intersect: false
            },
            plugins: {
                thresholdLines: {
                    lines: thresholdArray
                },
                legend: {
                    display: false
                },
                title: {
                    display: true,
                    color: 'white',
                    text: info.properties.monitoring_location_name,
                    font: {
                        size: 14
                    }
                },
                tooltip: {
                    enabled: true,
                    callbacks: {
                        label: function(context) {
                            const date = new Date(context.raw.x);
                            return `Value: ${context.raw.y} at ${date.toLocaleString()}`;
                        }
                    }
                }
            },
            scales: {
                x: {
                    type: 'time',
                    time: {
                        unit: 'day'
                    }
                },
                y: {
                    min: min - padding,
                    max: max + padding,
                    title: {
                        display: true,
                        text: 'Value'
                    }
                }
            }
        }
    });

    // update table footer
    createGraphFooter(location_id, data);

    // select item in table
    const tableCell = document.querySelector(`.gauge-cell.${location_id}`)
    if (tableCell != null) {
        tableCell.classList.add('selected');
    }
    
    // store chart instance for cleanup
    charts.push({
        id: chartId,
        instance: newChart,
        time_series_id: time_series_id,
        location_id: location_id,
        fullData: formattedData
    });   
    graphCount++; 
    
    return;
}

function createGraphFooter(location_id, data) {
    const footer = document.querySelector(`.chart-footer.${location_id}`);
    const thresholds = LOCATIONS[location_id].properties.thresholds
    const checkValue = (input) => input ?? '??';
    const formatDate = new Date(data.features[data.features.length - 1].properties.time).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }).replace(' ', '');
    const dataDiff = dataChange(data);

    footer.innerHTML = `
        <div>
            <span style="color: #FFFFFF">Base: ${checkValue(thresholds.base)}ft</span>
            <span style="color: #FFEA00">Minor: ${checkValue(thresholds.minor)}ft</span>
            <span style="color: #EE4B2B">Major: ${checkValue(thresholds.major)}ft</span>
            <span style="color: #8B0000">Failure: ${checkValue(thresholds.action)}ft</span>
        </div>
        <div style="justify-content: center;">
            <span style="color: #FFFFFF">Last Update: ${formatDate} - ${data.features[data.features.length - 1].properties.value}ft</span>
            <span style="gap: 0px; color: ${dataDiff.color} ">(${dataDiff.value}%)</span>
        </div>
    `;
    return;
}

function createThresholdArray(thresholds) {
    let thresholdArray = [];
    
    if (thresholds.base != null) {
        thresholdArray.push({
            value: thresholds.base,
            color: '#FFFFFF',
            dash: [5, 5]
        })
    }

    if (thresholds.minor != null) {
        thresholdArray.push({
            value: thresholds.minor,
            color: '#FFEA00',
            dash: []
        })
    }

    if (thresholds.major != null) {
        thresholdArray.push({
            value: thresholds.major,
            color: '#EE4B2B',
            dash: [5, 5]
        })
    }

    if (thresholds.action != null) {
        thresholdArray.push({
            value: thresholds.action,
            color: '#8B0000',
            dash: []
        })
    }

    return thresholdArray;
}

function dataChange(data) {
    const final = data.features[data.features.length - 1].properties.value;
    const prev = data.features[data.features.length - 13].properties.value;
    const diff = (((final - prev) / prev) * 100).toFixed(2);
    const color = diff >= 0 ? 'green' : 'red';
    return {
        color: color,
        value: diff
    }
}

function formatData(data) {
    let formattedData = [];
    for (let i = 0; i < data.features.length; i++) {
        formattedData.push({
            x: new Date(data.features[i].properties.time),
            y: parseFloat(data.features[i].properties.value)
        });
    }

    return formattedData;
}

async function filterDataByRange(data, hours) {
    const now = new Date();
    const cutoff = new Date(now.getTime() - hours * 60 * 60 * 1000);

    return data.filter(d => new Date(d.x) >= cutoff);
}

async function setRangeIndividual(chart, time) {
    const hours = (time == "hour") ? 24 : 168
    const filtered = await filterDataByRange(chart.fullData, hours);
    chart.instance.options.scales.x.time.displayFormats.hour = hours <= 24 ? 'ha' : 'MMM d';
        
    chart.instance.data.datasets[0].data = filtered;
    chart.instance.options.scales.x.time.unit = time;
    chart.instance.update();
}

async function reloadData() {
    showLoading();

    // reload gauge table
    const [overviewResults] = await Promise.all([
        fetchAndWait(USGS_OVERVIEW_URL)
    ]);
    USGS_OVERVIEW = overviewResults.features;
    const usgsGrouping = groupUSGSBySite(); 

    console.log(USGS_OVERVIEW);
    USGS_OVERVIEW.forEach((item) => {
        const id   = item.properties.monitoring_location_id;
        const usgsItem = usgsGrouping.get(id);
        const cell = document.querySelector(`.gauge-cell.${id}`);
        if (cell) {
            //cell.innerHTML = `<div class="circle">${item.properties.value}</div>`;
            cell.innerHTML = `<div class="circle">${gaugeReport(usgsItem, LOCATIONS[id])}</div>`;
        }
    });

    // reload graphs
    for (const chart of charts) {
        const updatedData = await GetGraphData(chart.time_series_id);
        const formatted = formatData(updatedData);

        chart.instance.data.datasets[0].data = [formatted];
        chart.instance.update();

        createGraphFooter(chart.location_id, updatedData);
    }

    //update scale
    console.log(CONFIG_VALUES["gauge-graphs"]["default-scale"]);
    setRange(CONFIG_VALUES["gauge-graphs"]["default-scale"]);

    console.log("Reloaded");
    hideLoading();
}

// update timer
function startCountdown(seconds) {
    // Clear any existing interval
    if (countdownInterval) {
        clearInterval(countdownInterval);
    }
    
    updateDisplay(seconds);
    
    countdownInterval = setInterval(() => {
        seconds--;
        updateDisplay(seconds);
    }, 1000);
}

// Update timer display
function updateDisplay(remaining) {
    const timerSpan = document.getElementById('timer');
    
    if (remaining <= 0) {
        timerSpan.textContent = '00:00';
        clearInterval(countdownInterval);

        startCountdown(CONFIG_VALUES["reload-time"]);
        reloadData();
    } else {
        timerSpan.textContent = `${formatTime(remaining)}`;
    }
}

function formatTime(seconds) {
    const minutes = Math.floor(seconds / 60);
    const remainingSeconds = seconds % 60;
    return `${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`;
}
