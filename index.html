<!DOCTYPE html>
<html data-theme="dark" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oahu Water Dashboard</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body data-theme="dark">
  <main class="container-fluid">

  <div id="loading-overlay">
    <div class="spinner"></div>
  </div>

  <div id="app">
    <h1>
        DEM Oahu Water Dashboard
        <button id="settings-button" onclick="toggleSettings(this)" style="font-weight: bold;">▽</button>
        <span id="last-update" style="margin-left: 15px; color: #ffffff;"></span>
    </h1>

    <div id="settings-container" style="display: none;">
      <hr>
      <div class="details-table-container settings">
        <table>
          <thead>
            <tr>
              <th colspan="2"><strong>Water Dashboard Settings</strong></th>
            </tr>
          </thead>
          <tbody id="settings-table-body">
          </tbody>
        </table>
      </div>
      <hr>
    </div>

    <section id="sectionTable">
      <div id="table-header-container"></div>
      <hr>
      <div id="table-container"></div>
    </section>

    <section id="sectionGraphs">
      <div id="graph-container"></div>
    </section>

    <div id="popupOverlay" class="popup-overlay" style="display: none" onclick="if(event.target === this) popupClose()">
      <div class="popup-content" onclick="event.stopPropagation()">
        <div class="popup-header">
            <div class="popup-header-text">Popup Title</div>
            <button class="popup-close" onclick="popupClose()">✕</button>
        </div>
        <div class="popup-body"></div>
      </div>
    </div>
  </div>

  </main>
  <script src="app.js"></script>
  
</body>
</html>
