<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oahu Dept. of Emergency Management Water Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer></script>
</head>

<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
  </div>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#"><strong>Honolulu Department of Emergency Management Water Dashboard</strong></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Settings</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Search</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Table</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Graphs</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid">
    <div id="search-container" class="d-flex gap-2 align-items-center py-3">
        <div class="d-flex align-items-center flex-grow-1 border rounded px-2" style="height:38px; background: var(--bs-body-bg);">
        <input id="search-input" type="text" oninput="search(this.value)" class="border-0 bg-transparent flex-grow-1" placeholder="Search gauges..." style="outline:none; color: var(--bs-body-color);" />
        <button id="search-btn" class="btn btn-sm border-0 p-0">
          <i class="ti ti-search fs-5"></i>
        </button>
      </div>

      <select id="filter-tag" class="form-select" style="width:auto;">
        <option value="">Filter by tag</option>
        <option value="USGS">USGS</option>
        <option value="UHSLC">UHSLC</option>
        <option value="ST">Stream</option>
        <option value="ST-CA">Canal</option>
        <option value="ST-DCH">Ditch</option>
        <option value="LK">Lake/Reservoir</option>
      </select>

      <select id="filter-id" class="form-select" style="width:auto;">
        <option value="">All gauge IDs</option>
      </select>
    </div>

    <template id="table-card-template">
      <div class="table-card col-12 col-sm-6 col-md-4 col-lg-2 col-xl-1">
        <div class="table-click card h-100">
          <div class="card-body">
            <h5 class="card-title"></h5>
            <p class="card-text mb-0">
              <strong class="table-value">-??</strong> ft
              <span class="table-change ms-1">(-??.?? -??.??%)</span>
            </p>
            <p class="card-text d-flex justify-content-between mb-1">
              <span class="table-date">??:?? am</span>
              <span class="table-threshold">?? ft</span>
            </p>
            <div class="table-tags mt-auto d-flex gap-2 flex-wrap"></div>
          </div>
        </div>
      </div>
    </template>
    <div id="table-container" class="row g-3"></div>

    <template id="graph-card-template">
      <div class="graph-card col-12 col-sm-12 col-md-6 col-lg-4">
        <div class="card h-100">
          <div class="card-body">
            <div class="d-flex align-items-center justify-content-between gap-2">
              <h5 class="card-title"></h5>
              <div class="card-buttons d-flex gap-2"></div>
            </div>
            <div class="card-chart"></div>
            <div class="graph-footer">
              <div class="graph-current d-flex align-items-center justify-content-between gap-2 mb-0">
                  <span class="d-flex gap-1">
                      <span>Latest:</span>
                      <span class="footer-latest">??ft </span>
                      <span class="footer-change">(+??.00 +??.??%)</span>
                      <span>@</span>
                      <span class="footer-time">??/??/?? ??:??AM</span>
                  </span>
                  <span class="footer-scale d-flex gap-1"></span>
              </div>
              <div class="graph-thresholds d-flex gap-2 w-100 justify-content-between">
                <span class="d-flex gap-1">
                    <span class="title-minor">Minor:</span>
                    <span class="footer-threshold minor">??ft</span>
                </span>
                <span class="d-flex gap-1">
                    <span class="title-moderate">Moderate:</span>
                    <span class="footer-threshold moderate">??ft</span>
                </span>
                <span class="d-flex gap-1">
                    <span class="title-major">Major:</span>
                    <span class="footer-threshold major">??ft</span>
                </span>
                <span class="d-flex gap-1">
                    <span class="title-action">Action:</span>
                    <span class="footer-threshold action">??ft</span>
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>
    <div id="graph-container" class="row g-3"></div>

  </main>
  <script src="app.js"></script>
</body>
</html>
